# Security headers for apps/admin.
#
# This lives in its own file because nginx's `add_header` does NOT merge across
# levels: a `location` that declares any `add_header` of its own drops every
# `add_header` inherited from `server`. Locations that set caching headers must
# therefore re-include this, or they silently ship with no security headers.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The admin app is entirely behind auth — keep it out of search indexes.
add_header X-Robots-Tag "noindex, nofollow" always;
